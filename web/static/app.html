<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/anchor.css">
<link rel="stylesheet" href="/static/cta.css">
<style>
body { min-height: 100vh; }
header.top { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px 14px; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: rgba(248, 250, 252, .9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
header.top .who { font-size: 13px; color: var(--mute-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--panel); color: var(--ink); font: 600 13px/1 var(--font-sans); cursor: pointer; }
.icon-btn:hover { background: var(--soft); }
.icon-btn[aria-pressed="true"] { background: var(--ink-strong); color: #fff; border-color: var(--ink-strong); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn.bare { border-color: transparent; background: transparent; padding: 0 8px; }
.icon-btn.bare:hover { background: var(--soft); }

/* Three columns: Library | chat | Sources. Either side can be hidden. */
.wrap { display: grid; grid-template-columns: 290px minmax(0, 1fr) 400px; min-height: calc(100vh - 57px); }
.wrap.no-lib { grid-template-columns: 0 minmax(0, 1fr) 400px; }
.wrap.no-src { grid-template-columns: 290px minmax(0, 1fr) 0; }
.wrap.no-lib.no-src { grid-template-columns: 0 minmax(0, 1fr) 0; }
.wrap.no-lib aside.lib, .wrap.no-src aside.src { display: none; }
/* Each pane keeps its own column: a hidden pane must not let the chat slide into its place. */
aside.lib { grid-column: 1; } main { grid-column: 2; } aside.src { grid-column: 3; }
aside { background: var(--panel); position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; overscroll-behavior: contain; }
aside.lib { border-right: 1px solid var(--line); padding: 18px 16px 24px; }
aside.src { border-left: 1px solid var(--line); padding: 18px 18px 28px; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.pane-head h2 { font-size: 19px; margin: 0; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 12px; padding: 0 11px; background: var(--bg); margin-bottom: 8px; }
.search svg { width: 16px; height: 16px; color: var(--mute); flex: none; }
.search input { border: 0; outline: 0; background: transparent; font: 14px/1 var(--font-sans); color: var(--ink); padding: 10px 0; width: 100%; }
.search:focus-within { border-color: var(--ink); }
.file { display: flex; gap: 10px; align-items: flex-start; padding: 9px 8px; margin: 0 -8px; border-radius: 12px; font-size: 13.5px; overflow-wrap: anywhere;
  text-decoration: none; color: inherit; position: relative; }
a.file:hover, a.file:focus-visible { background: var(--soft); }
.file .ext { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--soft); color: var(--mute-2); display: grid; place-items: center;
  font: 700 10px/1 var(--font-sans); letter-spacing: .03em; }
a.file:hover .ext { background: var(--panel); }
.file .name { font-weight: 500; color: var(--ink); }
.file .mute { color: var(--mute); font-size: 12.5px; }
.file .bad { color: #b91c1c; font-size: 12.5px; }
.frow { position: relative; }
.frow .file { padding-right: 36px; }
.frow .del { position: absolute; right: -4px; top: 9px; opacity: 0; }
.frow:hover .del, .frow:focus-within .del { opacity: 1; }
@media (hover: none) { .frow .del { opacity: 1; } }  /* phones have no hover: always show it */
.del { border: 0; background: transparent; color: var(--mute); cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.del:hover { background: #fee2e2; color: #b91c1c; }
.del svg { width: 15px; height: 15px; }
.confirm { margin: 4px 0 8px 44px; font-size: 12.5px; color: var(--mute-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn.danger { background: #b91c1c; border-color: #b91c1c; }
.lib-actions { margin-top: 14px; display: grid; gap: 8px; }
.libswitch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); margin-bottom: 12px; }
.libswitch button { border: 0; border-radius: 9px; padding: 8px 6px; background: transparent; color: var(--mute-2); font: 600 13px/1.2 var(--font-sans); cursor: pointer; }
.libswitch button[aria-selected="true"] { background: var(--panel); color: var(--ink-strong); box-shadow: var(--shadow-card); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 500 13.5px/1.3 var(--font-sans); cursor: pointer; }
.chip:hover { background: var(--soft); }
.lib-actions .hint { font-size: 12.5px; color: var(--mute); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--ink); display: inline-block; vertical-align: -1px; margin-right: 5px;
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { display: flex; flex-direction: column; min-width: 0; position: relative; }
#thread { flex: 1; padding: 8px 20px 24px; }
.col { max-width: 780px; margin: 0 auto; }
.empty { text-align: center; padding: 11vh 0 4vh; }
.empty h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.08; margin: 0 0 12px; color: var(--ink-strong); }
.empty p { color: var(--mute-2); margin: 0 auto 22px; max-width: 520px; }
.dock { position: sticky; bottom: 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, rgba(248, 250, 252, 0)); }
.attach { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.attach:hover { background: var(--soft); }
.attach svg { width: 18px; height: 18px; }
.composer .row .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ups { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.up { display: inline-flex; align-items: center; gap: 9px; max-width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 7px 11px 7px 7px; font-size: 13px; }
.up .ext { flex: none; width: 30px; height: 30px; border-radius: 8px; background: #fce7f3; color: #be185d; display: grid; place-items: center; font: 700 9.5px/1 var(--font-sans); }
.up .ext.ok { background: #d1fae5; color: #047857; }
.up b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; display: block; }
.up small { display: block; color: var(--mute); font-size: 12px; }
.up small.ok { color: var(--good); font-weight: 600; }
.up small.bad { color: #b91c1c; }
.drop { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(248, 250, 252, .82); backdrop-filter: blur(3px); }
.drop .box { border: 2px dashed var(--ink); border-radius: 26px; padding: 44px 56px; text-align: center; background: var(--panel); box-shadow: var(--shadow-card); }
.drop .box b { display: block; font: 500 26px/1.2 var(--font-display); color: var(--ink-strong); margin-bottom: 6px; }
.drop .box span { color: var(--mute-2); font-size: 14px; }

/* Sources panel */
.src-for { font-size: 12.5px; color: var(--mute); margin: -4px 0 14px; overflow-wrap: anywhere; }
.src-empty { color: var(--mute-2); font-size: 14px; display: flex; gap: 10px; align-items: center; padding: 18px 0; }
.src-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin: 14px 0 8px; }
.src-label.muted { margin-top: 22px; }
.xc { display: block; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); padding: 12px 13px; margin-bottom: 10px; scroll-margin-top: 14px; }
article.xc { background: var(--panel); box-shadow: var(--shadow-card); }
.xc.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--ink); } 100% { box-shadow: var(--shadow-card); } }
.xc-head { font-size: 13px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.xc-head svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; }
.xc-loc { font-weight: 500; color: var(--mute-2); white-space: nowrap; }
.xc-loc::before { content: " · "; }
details.xc summary { cursor: pointer; list-style: none; }
details.xc summary::-webkit-details-marker { display: none; }
details.xc summary .xc-head::after { content: "Show"; float: right; margin-left: 10px; font-size: 12px; font-weight: 600; color: var(--mute); }
details.xc[open] summary .xc-head::after { content: "Hide"; }
.xc-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--mute); margin: 5px 0 8px; }
.xc-meta span { font-weight: 600; color: var(--mute-2); }
.xc-open { color: var(--ink); font-weight: 600; text-decoration: none; white-space: nowrap; }
.xc-open:hover { text-decoration: underline; }
.xc-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; line-height: 1.6; color: var(--mute-2); max-height: 340px; overflow-y: auto;
  border-top: 1px solid var(--line); padding-top: 9px; }
.xc-text mark { background: #fde68a; color: var(--ink-strong); border-radius: 3px; padding: 0 1px; }
.xc-text mark.on { box-shadow: 0 0 0 2px #f59e0b; }

.err { color: #b91c1c; font-size: 13.5px; }
dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--panel); color: var(--ink); max-width: min(780px, 94vw); padding: 22px; }
dialog::backdrop { background: rgba(2, 6, 23, .35); }
.scrim { display: none; }

/* Narrow screens: the Library and Sources slide over the chat and start closed. */

@media (max-width: 1100px) {
  .wrap, .wrap.no-lib, .wrap.no-src, .wrap.no-lib.no-src { grid-template-columns: minmax(0, 1fr); }
  main { grid-column: 1; }
  aside.lib, aside.src { position: fixed; top: 0; bottom: 0; z-index: 30; height: auto; width: min(400px, 92vw); box-shadow: 0 20px 60px rgba(2, 6, 23, .25);
    padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  aside.lib { left: 0; } aside.src { right: 0; }
  .wrap:not(.no-lib) ~ .scrim, .wrap:not(.no-src) ~ .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(2, 6, 23, .3); }
  header.top .who { display: none; }
}
@media (max-width: 520px) { .icon-btn .lbl { display: none; } .composer .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .xc.flash { animation: none; } }
</style></head>
<body>
<div id="app">
  <header class="top">
    <div class="side">
      <button class="icon-btn" id="lib-btn" aria-pressed="true" aria-controls="lib" title="Show or hide your Library"></button>
      <a class="brand" href="/"><span id="logo2"></span>Anchor</a>
    </div>
    <div class="side"><span class="who" id="status"></span>
      <button class="icon-btn" id="src-btn" aria-pressed="true" aria-controls="src" title="Show or hide the sources"></button></div>
  </header>
  <div class="wrap" id="wrap">
    <aside class="lib" id="lib" aria-label="Your Library">
      <div class="pane-head"><h2>Library</h2><button class="icon-btn bare" id="lib-hide" title="Hide the Library"></button></div>
      <div class="libswitch" role="tablist" aria-label="Which Library answers">
        <button role="tab" id="lib-demo" data-lib="demo" aria-selected="true">Sample course</button>
        <button role="tab" id="lib-mine" data-lib="mine" aria-selected="false">My files</button>
      </div>
      <label class="search"><span id="search-ico"></span><input id="find" type="search" placeholder="Search these files" aria-label="Search these files"></label>
      <div id="files"></div>
      <div class="lib-actions">
        <button class="btn ghost small" id="add-btn">Add files</button>
        <div class="hint" id="add-hint"></div>
      </div>
    </aside>
    <main>
      <div id="thread"><div class="col" id="col">
        <div class="empty" id="empty"></div>
      </div></div>
      <div class="dock"><div class="col">
        <form class="composer" id="ask">
          <div class="ups" id="ups" hidden></div>
          <textarea id="question" rows="2" placeholder="Ask about your course material…"></textarea>
          <div class="row"><div class="left"><button type="button" class="attach" id="attach" title="Add files to My files" aria-label="Add files"></button>
            <span class="hint">Enter to send · Shift+Enter for a new line</span></div>
            <button class="send" id="send" aria-label="Ask"></button></div></form>
      </div></div>
    </main>
    <aside class="src" id="src" aria-label="Sources">
      <div class="pane-head"><h2>Sources</h2><button class="icon-btn bare" id="src-hide" title="Hide the sources"></button></div>
      <div id="sources"><div class="src-empty">Ask a question: the excerpts its answer comes from show up here.</div></div>
    </aside>
  </div>
  <div class="scrim" id="scrim"></div>
</div>
<input type="file" id="pick" multiple hidden accept=".pdf,.txt,.md">
<div class="drop" id="drop" hidden><div class="box"><b>Drop to add to My files</b><span>PDFs with selectable text, and notes (.txt, .md)</span></div></div>

<script src="/static/config.js"></script>
<script src="/static/answer.js"></script>
<script src="/static/cta.js"></script>
<script>
const $ = id => document.getElementById(id);
const API = (window.VITE_API_BASE || "http://localhost:8080").replace(/\/+$/, "");
let files = [], library = "demo", limits = {};
const ICON = {
  lib: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>`,
  src: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,
};
$("logo2").outerHTML = ANCHOR_SVG; $("send").innerHTML = SEND_SVG;
$("lib-btn").innerHTML = ICON.lib + `<span class="lbl">Library</span>`; $("src-btn").innerHTML = ICON.src + `<span class="lbl">Sources</span>`;
$("lib-hide").innerHTML = ICON.close; $("src-hide").innerHTML = ICON.close; $("search-ico").outerHTML = ICON.search; $("attach").innerHTML = ICON.plus;

// No accounts: this browser's own uploads are kept under an anonymous id, stored here and sent with each call.
const store = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;
let SESSION = store.get("anchor-session");
if (!UUID.test(SESSION || "")) {
  SESSION = crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
  store.set("anchor-session", SESSION);
}

// Every call: the API base, the session header, and the AI Lodge limit (429 -> CTA, 503 -> paused notice).
async function call(path, opts = {}) {
  const r = await fetch(API + path, {...opts, headers: {"X-Anchor-Session": SESSION, ...(opts.headers || {})}});
  if (r.ok) return r;
  const data = await r.json().catch(() => ({}));
  if (r.status === 429) { AnchorCTA.showRateLimit(data.detail?.queries_used); throw Object.assign(new Error("You've reached this demo's limit."), {quiet: true}); }
  if (r.status === 503) { AnchorCTA.showPaused(data.detail?.message); throw Object.assign(new Error("This demo is paused right now."), {quiet: true}); }
  const d = data.detail;
  throw new Error((typeof d === "string" ? d : d?.message) || ("Error " + r.status));
}
async function api(path, opts = {}) { return (await call(path, opts)).json(); }

// ---- Panels: the Library and the Sources can each be hidden; the choice is remembered on this device.
const narrow = () => matchMedia("(max-width: 1100px)").matches;
function setPane(which, open, remember = true) {
  $("wrap").classList.toggle("no-" + which, !open);
  $(which + "-btn").setAttribute("aria-pressed", String(open));
  if (remember && !narrow()) store.set("anchor-" + which, open ? "open" : "closed");
}
const paneOpen = which => !$("wrap").classList.contains("no-" + which);
setPane("lib", !narrow() && store.get("anchor-lib") !== "closed", false);
setPane("src", !narrow() && store.get("anchor-src") !== "closed", false);
$("lib-btn").onclick = () => { if (narrow()) setPane("src", false); setPane("lib", !paneOpen("lib")); };
$("src-btn").onclick = () => { if (narrow()) setPane("lib", false); setPane("src", !paneOpen("src")); };
$("lib-hide").onclick = () => setPane("lib", false);
$("src-hide").onclick = () => setPane("src", false);
$("scrim").onclick = () => { setPane("lib", false, false); setPane("src", false, false); };

// ---- Citations and files: a click opens the file's readable copy with the cited place marked.
// The copy is fetched with this browser's session id, which a plain link can't carry, so links are
// "#file:<id>:<loc>:<quote>" and the click handler below opens the copy in a new tab.
const fileHref = (f, loc, quote) => `#file:${f.id}:` + encodeURIComponent(loc || "") + ":" + encodeURIComponent(quote || "");
function citeHref(src, quote) {
  const f = files.find(x => x.name === src.file);
  return f ? fileHref(f, src.loc, quote) : null;
}
const OPTS = {citeHref, sources: true, pictureSrc: () => ""};

function viewHTML(f, loc, q) {
  const squash = t => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const lines = f.body.split("\n"), key = squash(q).slice(0, 60);
  let first = key ? lines.findIndex(l => squash(l).includes(key)) : -1;
  if (first < 0 && loc) {
    const n = +(/(\d+)/.exec(loc) || [])[1];
    if (n) first = f.format === "Text" ? lines.findIndex(l => +(/^\s*(\d+)/.exec(l) || [])[1] === n)
                                       : lines.findIndex(l => l.trim() === `## page ${n}`);
  }
  const body = lines.map((l, i) => i === first ? `<mark id="here">${esc(l)}</mark>` : esc(l)).join("\n");
  return `<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${esc(f.name)}</title><link rel="stylesheet" href="${location.origin}/static/anchor.css">
    <style>.src{max-width:960px;margin:0 auto;padding:28px 20px 60px}.src h1{font-size:28px;margin:6px 0 4px;overflow-wrap:anywhere}
    .src .where{color:var(--mute-2);margin-bottom:18px}.src pre{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;font:13.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:var(--shadow-card)}
    mark{background:#fde68a;color:var(--ink-strong);border-radius:4px;padding:1px 2px;box-shadow:0 0 0 3px #fde68a}</style>
    <div class="src"><div style="color:var(--mute);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em">Source</div>
    <h1>${esc(f.name)}</h1><div class="where">${esc(loc) || "Whole file"}${first >= 0 ? " · the cited place is marked" : ""}</div><pre>${body}</pre></div>
    <script>const h=document.getElementById("here");if(h)h.scrollIntoView({block:"center"})<\/script>`;
}
document.addEventListener("click", async e => {
  const a = e.target.closest('a[href^="#file:"]');
  if (!a) return;
  e.preventDefault();
  const [, id, loc, q] = a.getAttribute("href").split(":");
  const tab = open("", "_blank");
  try {
    const f = await api(`/api/files/${id}`);
    const url = URL.createObjectURL(new Blob([viewHTML(f, decodeURIComponent(loc), decodeURIComponent(q))], {type: "text/html"}));
    if (tab) tab.location = url; else location.href = url;
  } catch (err) { if (tab) tab.close(); alertLine(err.message); }
});

const EXT = {PDF: "PDF", Text: "TXT", Markdown: "MD"};
const extOf = name => (/\.([a-z0-9]+)$/i.exec(name || "")?.[1] || "file").slice(0, 4).toUpperCase();
let confirming = null;
function renderFiles() {
  const q = $("find").value.trim().toLowerCase();
  const shown = files.filter(f => !q || f.name.toLowerCase().includes(q));
  const editable = library === "mine";
  $("files").innerHTML = !files.length ? `<div style="color:var(--mute);font-size:13.5px;padding:6px 0">${editable ? "No files yet." : "The sample course hasn't been loaded yet."}</div>`
    : !shown.length ? `<div style="color:var(--mute);font-size:13.5px;padding:6px 0">No file matches “${esc($("find").value)}”.</div>`
    : shown.map(f => {
      const meta = `<div class="mute">${esc(f.format)}${f.format === "PDF" ? ` · ${f.pages} page${f.pages === 1 ? "" : "s"}` : ""}</div>`;
      const inner = `<span class="ext">${EXT[f.format] || "FILE"}</span><div><div class="name">${esc(f.name)}</div>${meta}</div>`;
      const del = editable ? `<button class="del" data-del="${f.id}" title="Delete ${esc(f.name)}" aria-label="Delete ${esc(f.name)}">${ICON.trash}</button>` : "";
      const ask = confirming === f.id ? `<div class="confirm">Delete it from your Library and every search index?
          <button class="btn small danger" data-yes="${f.id}">Delete</button><button class="btn ghost small" data-no>Keep</button></div>` : "";
      return `<div class="frow"><a class="file" href="${esc(fileHref(f))}" title="Open ${esc(f.name)}">${inner}</a>${del}</div>${ask}`;
    }).join("");
  $("add-btn").hidden = $("attach").hidden = !editable;
  $("add-hint").textContent = editable
    ? `Up to ${limits.max_files || 3} files: PDFs with selectable text, and notes (.txt, .md). Or drag them into the chat. They're deleted after ${limits.ttl_hours || 24} hours. Anyone with this browser's anonymous id could see them.`
    : "A fictional course written for this demo. Switch to My files to ask about your own.";
}
$("find").addEventListener("input", renderFiles);
$("files").addEventListener("click", async e => {
  const del = e.target.closest("[data-del]"), yes = e.target.closest("[data-yes]"), no = e.target.closest("[data-no]");
  if (del) { e.preventDefault(); confirming = +del.dataset.del; renderFiles(); }
  else if (no) { confirming = null; renderFiles(); }
  else if (yes) {
    try { await api(`/api/files/${yes.dataset.yes}`, {method: "DELETE"}); } catch (err) { alertLine(err.message); }
    confirming = null; await loadFiles();
  } else if (narrow() && e.target.closest("a.file")) setPane("lib", false, false);
});
async function loadFiles() {
  try { const r = await api(`/api/files?library=${library}`); files = r.files; limits = r; }
  catch (err) { files = []; alertLine(err.message); }
  renderFiles(); renderEmpty();
}
function setLibrary(which) {
  library = which; store.set("anchor-library", which);
  document.querySelectorAll(".libswitch button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.lib === which)));
  $("question").placeholder = which === "demo" ? "Ask about the sample course…" : "Ask about your files…";
  $("col").innerHTML = `<div class="empty" id="empty"></div>`;
  srcTurn = null;
  chatLog = loadHistory();
  chatLog.forEach(m => { const el = add(answerHTML(m.question, m.answer, OPTS)); Object.assign(el, {question: m.question, answer: m.answer}); el.dataset.state = "done"; });
  const last = $("col").querySelector(".turn:last-child");
  if (last) showSources(last);
  else $("sources").innerHTML = `<div class="src-empty">Ask a question: the excerpts its answer comes from show up here.</div>`;
  loadFiles();
}
document.querySelector(".libswitch").addEventListener("click", e => {
  const b = e.target.closest("button[data-lib]");
  if (b && b.dataset.lib !== library) setLibrary(b.dataset.lib);
});

// ---- Uploads: drag files anywhere onto the page, or use + / "Add files". Each is read and indexed in one call.
let uploads = [];  // {name, state: sending | ready | failed, note}
function renderUploads() {
  $("ups").hidden = !uploads.length;
  $("ups").innerHTML = uploads.map(u => {
    const note = u.state === "ready" ? `<small class="ok">Added to My files ✓</small>`
      : u.state === "failed" ? `<small class="bad">${esc(u.note)}</small>`
      : `<small><span class="spin"></span>${esc(u.note)}…</small>`;
    return `<div class="up"><span class="ext ${u.state === "ready" ? "ok" : ""}">${esc(extOf(u.name))}</span><div style="min-width:0"><b>${esc(u.name)}</b>${note}</div></div>`;
  }).join("");
}
async function upload(list) {
  if (library !== "mine") setLibrary("mine");
  for (const file of list) {
    const u = {name: file.name, state: "sending", note: "Reading and indexing"};
    uploads.push(u); renderUploads();
    try {
      const fd = new FormData(); fd.append("file", file);
      await call("/api/upload", {method: "POST", body: fd});
      u.state = "ready";
    } catch (err) { Object.assign(u, {state: "failed", note: err.message}); if (err.quiet) { renderUploads(); break; } }
    renderUploads();
  }
  await loadFiles();
}
$("attach").onclick = $("add-btn").onclick = () => $("pick").click();
$("pick").onchange = () => { upload([...$("pick").files]); $("pick").value = ""; };

let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("drop").hidden = false; });
addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("drop").hidden = true; } });
addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $("drop").hidden = true; upload([...e.dataTransfer.files]); });

const SAMPLES = ["What happens if I submit a lab 2 days late?", "When does Quiz 1 close?", "When is the group project demo?",
                 "Who sets the final exam paper?"];
function renderEmpty() {
  const el = $("empty");
  if (!el) return;
  if (library === "demo") {
    el.innerHTML = `<h1>What do you want to know?</h1><p>Ask about the sample course, a fictional cloud computing course written for this demo. Answers quote its files, link to the exact place, and say plainly when the materials don't cover something.</p>
      <div class="chips">${SAMPLES.map(q => `<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
  } else if (files.length) {
    el.innerHTML = `<h1>What do you want to know?</h1><p>Ask about anything in your files. Answers quote them, link to the exact place, and say plainly when your materials don't cover something.</p>`;
  } else {
    el.innerHTML = `<h1>Add your course files.</h1><p>Drag them here or <a href="#" id="empty-add">choose files</a>: PDFs with selectable text, and notes (.txt, .md). Then ask anything about them.</p>`;
    const a = $("empty-add");
    if (a) a.onclick = e => { e.preventDefault(); $("pick").click(); };
  }
}
$("col").addEventListener("click", e => { const c = e.target.closest(".chip[data-q]"); if (c) { $("question").value = c.dataset.q; $("ask").requestSubmit(); } });

// ---- Chat. The chatLog stays in this browser, one per Library; a follow-up sends its last few turns.
const histKey = () => "anchor-history-" + library;
let chatLog = [];
function loadHistory() { try { return JSON.parse(store.get(histKey()) || "[]"); } catch { return []; } }
function saveHistory() { store.set(histKey(), JSON.stringify(chatLog.slice(-20))); }
const toBottom = () => requestAnimationFrame(() => scrollTo({top: document.documentElement.scrollHeight, behavior: "smooth"}));
function add(html) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = html;
  $("col").appendChild(el);
  toBottom();
  return el;
}
const alertLine = msg => add(`<div class="ans-card"><div class="err">${esc(msg)}</div></div>`);

// The Sources panel shows one answer at a time: the newest, until a Source button picks another.
let srcTurn = null;
function showSources(el, state) {
  srcTurn = el;
  $("sources").innerHTML = sourcesHTML(el.question, el.answer, OPTS, state);
  // Each excerpt opens at its first marked quote, not at the top of the passage.
  $("sources").querySelectorAll(".xc-text").forEach(box => {
    const m = box.querySelector("mark");
    if (m) box.scrollTop = Math.max(0, m.offsetTop - box.offsetTop - 40);
  });
}
function sourceFor(el, state) { if (!srcTurn || srcTurn === el || el.newest) showSources(el, state); }

// An answer streams in (/api/ask/stream, one JSON event per line): "Reading your Library…", the excerpts
// found, then the steps and the final answer as they are written, then the check, then the finished card.
// el.dataset.state follows along: reading | writing | checking | done.
async function askStream(q, el) {
  const nearBottom = () => innerHeight + scrollY >= document.documentElement.scrollHeight - 160;
  const show = (state, html) => {
    const stick = nearBottom();
    el.dataset.state = state;
    el.innerHTML = html;
    if (stick) scrollTo({top: document.documentElement.scrollHeight});
  };
  const turns = chatLog.slice(-3).map(h => ({question: h.question.slice(0, 1000), final_answer: String(h.answer.final_answer || "").slice(0, 2000)}));
  const r = await call("/api/ask/stream", {method: "POST", headers: {"Content-Type": "application/json"},
                                           body: JSON.stringify({question: q, library, chatLog: turns})});
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", excerpts = [];
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
      if (!line.trim()) continue;
      const ev = JSON.parse(line);
      if (ev.type === "stage" && ev.stage === "reading") { el.answer = null; excerpts = []; show("reading", thinkingHTML(q)); sourceFor(el, "reading"); }
      else if (ev.type === "excerpts") { excerpts = ev.excerpts; el.answer = {excerpts, steps: []}; sourceFor(el, "writing"); }
      else if (ev.type === "draft") { el.answer = {...ev.answer, excerpts}; show("writing", answerHTML(q, el.answer, {...OPTS, state: "writing"})); sourceFor(el, "writing"); }
      else if (ev.type === "stage" && ev.stage === "checking") { if (el.answer?.final_answer !== undefined) show("checking", answerHTML(q, el.answer, {...OPTS, state: "checking"})); }
      else if (ev.type === "done") { el.answer = ev.answer; show("done", answerHTML(q, ev.answer, OPTS)); sourceFor(el); return ev; }
      else if (ev.type === "error") throw new Error(ev.message);
    }
  }
  throw new Error("The answer was cut off. Please ask again.");
}

$("ask").onsubmit = async e => {
  e.preventDefault();
  const q = $("question").value.trim();
  if (!q) return;
  $("send").disabled = true; $("question").value = "";
  uploads = uploads.filter(u => u.state === "sending"); renderUploads();
  $("col").querySelectorAll(".turn").forEach(t => t.newest = false);
  const el = add(thinkingHTML(q));
  Object.assign(el, {question: q, answer: null, newest: true});
  el.dataset.state = "reading";
  showSources(el, "reading");
  try {
    const ev = await askStream(q, el);
    chatLog.push({question: q, answer: ev.answer}); saveHistory();
  } catch (err) {
    el.dataset.state = "error";
    el.innerHTML = `<div class="ans-q">${esc(q)}</div><div class="ans-card"><div class="err">${esc(err.message)}</div></div>`;
    $("sources").innerHTML = `<div class="src-empty">No sources: the question was not answered.</div>`;
  } finally { $("send").disabled = false; $("question").focus(); }
};
$("question").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); } });

// A step's Source button opens the Sources panel at its excerpt, with the step's quote marked.
$("col").addEventListener("click", e => {
  const b = e.target.closest(".ans-src");
  if (!b) return;
  const turn = b.closest(".turn");
  if (!turn?.answer) return;
  showSources(turn, turn.dataset.state === "done" ? undefined : "writing");
  if (narrow()) setPane("lib", false, false);
  setPane("src", true, !narrow());
  const card = [...$("sources").querySelectorAll(".xc")].find(x => x.dataset.ex === b.dataset.ex);
  if (!card) return;
  if (card.tagName === "DETAILS") card.open = true;
  card.querySelectorAll("mark").forEach(m => m.classList.toggle("on", m.dataset.step === b.dataset.step));
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  const mark = card.querySelector(`mark[data-step="${b.dataset.step}"]`), box = card.querySelector(".xc-text");
  if (mark && box) box.scrollTop = Math.max(0, mark.offsetTop - box.offsetTop - 40);
  card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
});

$("status").textContent = "AI Lodge demo · no sign-in";
setLibrary(store.get("anchor-library") === "mine" ? "mine" : "demo");
// A question handed over from the front page ("/app?q=...") waits in the box, unsent.
const handed = new URLSearchParams(location.search).get("q");
if (handed) $("question").value = handed;
</script>
</body></html>
